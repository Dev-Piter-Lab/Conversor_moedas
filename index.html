<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <img class="logo1" src="./assets/Dollar Note.gif" alt="logo-convert-money">
    <img class="logo2" src="./assets/Dollar Note.gif" alt="logo-convert-money">

    <main>
        <label>
            Converter <b>de</b>
            <select class="currency-initial-select">
                <option value="current-real">R$  Real Brasileiro</option>
                <option value="current-dolar">US$ Dólar Americano</option>
                <option value="current-euro">€ Euro</option>
                <option value="current-libra">£ Libra Esterlina</option>
                <option value="current-bitcoin">₿ Bitcoin</option>
            </select>
        </label>
 
        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$  Dólar Americano</option>
                <option value="real">R$  Real Brasileiro</option>
                <option value="euro">€  Euro</option>
                <option value="libra">£  Libra Esterlina</option>
                <option value="bitcoin">₿  Bitcoin</option>
            </select>
        </label>

        <label> 
            Valor:
            <input class="input-currency" placeholder="R$ 10.000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img class="img-to-convert" src="./assets/brasil.png" alt="logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>
                            
            <img class="arrow-img" src="./assets/seta.png" alt="logo-seta">
                
            <div class="currency-box">
                <img class="img-converted" src="./assets/estados-unidos.png" alt="logo-moeda-convertida">
                <p class="currency-converted">Dólar</p>
                <p class="currency-value">$0.00</p>
            </div>
        </section>
    </main>

<script src="./script.js"></script>
</body>

</html>
