<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <img class="logo" src="./assents/logo.gif" alt="logo-convert-money">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$  Real Brasileiro</option>
            </select>
        </label>
 
        <label>
            Converter <b>para</b>
            <select>
                <option>US$  Dólar Americano</option>
                <option>€  Euro</option>
            </select>
        </label>

        <label> 
            Valor:
            <input placeholder="R$ 10.000,00">
        </label>

        <button>Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assents/brasil 1.png" alt="logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>
                            
            <img class="arrow-img" src="./assents/seta.png" alt="logo-seta">
                
            <div class="currency-box">
                <img src="./assents/estados-unidos 1.png" alt="logo-moeda-convertida">
                <p class="currency">Dólar</p>
                <p class="currency-value">US$ 0.0</p>
            </div>
        </section>
    </main>


</body>

</html>
